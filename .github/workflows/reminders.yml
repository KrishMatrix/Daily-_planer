# Runs the reminder job every 5 minutes so class/meeting reminders and push
# notifications arrive on time. (Vercel Hobby crons can only run once a day.)
# Set repository secrets APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
# Note: GitHub may delay scheduled runs by several minutes under load.
name: reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder job
        run: |
          curl -fsS -m 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/reminders"
